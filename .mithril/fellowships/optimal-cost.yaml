# Optimal Cost Fellowship — prioritizes cheap GGUF for trivial tasks
# Uses Groq free tier for fast coding, Gemini Pro only when needed

name: "optimal-cost"
description: "Cost-optimized: GGUF for trivial, Groq for coding, Gemini Pro for review"

controller:
  provider: local
  model: qwen-1.5b
  context_window: 2

max_rounds: 20
token_budget: 30000

agents:
  - name: "coder"
    provider: groq
    model: llama-3.3-70b-versatile
    role: "Fast coder. Implements features, fixes bugs, writes tests."
    when: "coding task, implementation, bug fix, test writing"
    can_call: ["architect", "gguf"]
    tools: ["*"]

  - name: "architect"
    provider: gemini
    model: gemini-2.5-pro
    role: "Architect. Complex design decisions, refactoring plans, code review."
    when: "architecture design, complex refactoring, code review request"
    can_call: ["coder"]
    tools: ["read_psi", "grep_files", "list_files", "git_diff"]

token_tracking:
  enabled: true
  show_per_agent: true
