name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mithril-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mithril-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mithril-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: mithril-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mithril-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev clang
      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
      - name: Build with cargo
        run: cargo build --release --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz mithril
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip mithril.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  wheels-linux-x64:
    name: Build Wheels Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev clang
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          sccache: 'true'
          manylinux: 'auto'
          container: off
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  wheels-linux-arm64:
    name: Build Wheels Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev clang
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist
          sccache: 'true'
          manylinux: 'auto'
          container: off
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: dist

  wheels-macos:
    name: Build Wheels macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  wheels-windows:
    name: Build Wheels Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels-linux-x64, wheels-linux-arm64, wheels-macos, wheels-windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'GiacomoSaccaggi/Mithril'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/giacomosaccaggi/mithril:${{ steps.version.outputs.tag }}
            ghcr.io/giacomosaccaggi/mithril:latest

  create-release:
    name: Create GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mithril-*
          path: artifacts
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mithril-macos-arm64/mithril-macos-arm64.tar.gz
            artifacts/mithril-macos-x64/mithril-macos-x64.tar.gz
            artifacts/mithril-linux-x64/mithril-linux-x64.tar.gz
            artifacts/mithril-linux-arm64/mithril-linux-arm64.tar.gz
            artifacts/mithril-windows-x64/mithril-windows-x64.zip

  update-homebrew:
    name: Update Homebrew Formula
    needs: create-release
    runs-on: ubuntu-latest
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'GiacomoSaccaggi/Mithril'
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "Skipping Homebrew tap update because HOMEBREW_TAP_TOKEN secret is not configured."
      - uses: actions/download-artifact@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          pattern: mithril-*
          path: artifacts
      - name: Update tap formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SHA_MAC_ARM=$(sha256sum artifacts/mithril-macos-arm64/mithril-macos-arm64.tar.gz | awk '{print $1}')
          SHA_MAC_X64=$(sha256sum artifacts/mithril-macos-x64/mithril-macos-x64.tar.gz | awk '{print $1}')
          SHA_LIN_ARM=$(sha256sum artifacts/mithril-linux-arm64/mithril-linux-arm64.tar.gz | awk '{print $1}')
          SHA_LIN_X64=$(sha256sum artifacts/mithril-linux-x64/mithril-linux-x64.tar.gz | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/GiacomoSaccaggi/homebrew-tap.git" tap
          cat > tap/Formula/mithril.rb <<EOF
          class Mithril < Formula
            desc "Multi-model orchestration engine. Combine LLM providers into one Ollama-compatible API."
            homepage "https://github.com/GiacomoSaccaggi/Mithril"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/GiacomoSaccaggi/Mithril/releases/download/v${VERSION}/mithril-macos-arm64.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
              on_intel do
                url "https://github.com/GiacomoSaccaggi/Mithril/releases/download/v${VERSION}/mithril-macos-x64.tar.gz"
                sha256 "${SHA_MAC_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/GiacomoSaccaggi/Mithril/releases/download/v${VERSION}/mithril-linux-arm64.tar.gz"
                sha256 "${SHA_LIN_ARM}"
              end
              on_intel do
                url "https://github.com/GiacomoSaccaggi/Mithril/releases/download/v${VERSION}/mithril-linux-x64.tar.gz"
                sha256 "${SHA_LIN_X64}"
              end
            end

            def install
              bin.install "mithril"
            end

            test do
              assert_match "mithril ${VERSION}", shell_output("#{bin}/mithril --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mithril.rb
          git diff --cached --quiet || (git commit -m "mithril ${VERSION}" && git push)
