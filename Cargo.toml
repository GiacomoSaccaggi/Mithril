[package]
name = "mithril"
version = "0.5.2"
edition = "2021"
description = "Multi-model orchestration engine. Combine LLM providers into a single Ollama-compatible API."
license = "MIT"
repository = "https://github.com/GiacomoSaccaggi/Mithril"
homepage = "https://giacomosaccaggi.github.io/Mithril/"
keywords = ["llm", "ai", "ollama", "multi-agent", "orchestration"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "mithril"
path = "src/main.rs"

[lib]
name = "mithril"
path = "src/lib.rs"

[dependencies]
llama-cpp-2 = "0.1"
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.4", features = ["limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
dirs = "5"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
encoding_rs = "0.8"
urlencoding = "2"
pathdiff = "0.2"

# CLI interactive
rustyline = "14"
crossterm = "0.28"
ratatui = "0.29"
colored = "2"

# Encryption for credentials
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# Telegram bot
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Global singletons
lazy_static = "1"

# Async traits
async-trait = "0.1"

# System info
whoami = "1"
aquamarine = "0.6.0"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
